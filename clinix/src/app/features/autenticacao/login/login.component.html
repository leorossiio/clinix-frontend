<main class="caixa">
  <h1>Bem-vindo ao <span class="destaque">CLINIX</span></h1>
  <p class="subtitulo">Acesso</p>

  @if (sessaoExpirada) {
    <p class="alerta alerta--info">Sua sessão expirou. Entre novamente.</p>
  }
  @if (erro()) {
    <p class="alerta alerta--erro" role="alert">{{ erro() }}</p>
  }

  <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="campoInvalido('email')"
        aria-describedby="erro-email"
      />
      @if (campoInvalido('email')) {
        <span id="erro-email" class="campo__erro">Informe um e-mail válido.</span>
      }
    </div>

    <div class="campo campo-senha">
      <label for="senha">Senha</label>
      <input
        id="senha"
        [type]="mostrarSenha() ? 'text' : 'password'"
        formControlName="senha"
        autocomplete="current-password"
        [attr.aria-invalid]="campoInvalido('senha')"
      />
      <button
        type="button"
        class="mostrar-senha"
        [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="mostrarSenha()"
        (click)="mostrarSenha.set(!mostrarSenha())"
      >
        {{ mostrarSenha() ? '🙈' : '👁️' }}
      </button>
      @if (campoInvalido('senha')) {
        <span class="campo__erro">Informe a senha.</span>
      }
    </div>

    <div class="acoes">
      <button type="submit" class="botao botao--primario botao--bloco" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
      <a routerLink="/cadastro" class="botao botao--secundario botao--bloco"
        >Criar conta de paciente</a
      >
    </div>
  </form>

  <p class="rodape-da-caixa">
    <a routerLink="/termos">Termos de Uso</a> · <a routerLink="/privacidade">Privacidade</a>
  </p>
</main>
