<header class="cabecalho">
  <div class="interno">
    <a routerLink="/consultas" class="inicio" aria-label="Clinix, página inicial">
      <app-marca />
    </a>

    @if (usuario()) {
      <nav aria-label="Navegação principal">
        <a routerLink="/consultas" routerLinkActive="ativo" ariaCurrentWhenActive="page">
          Consultas
        </a>
        @if (ehAdmin()) {
          <a routerLink="/usuarios" routerLinkActive="ativo" ariaCurrentWhenActive="page">
            Usuários
          </a>
        }
      </nav>

      <div class="conta">
        <span class="avatar" aria-hidden="true">{{ iniciais() }}</span>
        <span class="identidade">
          <strong>{{ primeiroNome() }}</strong>
          <small>{{ perfil() }}</small>
        </span>
        <button type="button" class="botao botao--discreto botao--pequeno" (click)="sair()">
          <app-icone nome="sair" [tamanho]="16" />
          Sair
        </button>
      </div>
    } @else {
      <a routerLink="/login" class="botao botao--secundario botao--pequeno">Entrar</a>
    }
  </div>
</header>
